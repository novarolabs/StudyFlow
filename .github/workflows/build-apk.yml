name: Build StudyFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StudyFlow
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --org com.cypherdigitallabs .

      - name: Add Firebase configuration
        run: |
          cp firebase/google-services.json android/app/google-services.json

      - name: Configure Firebase Google Services plugin
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i '/plugins {/a\
    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts

            sed -i '/plugins {/a\
    id("com.google.gms.google-services")' android/app/build.gradle.kts

          elif [ -f android/build.gradle ]; then
            sed -i '/dependencies {/a\
        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle

            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload StudyFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
